# Fly.io app config — generated by hand (no `fly launch` yet), see
# CLAUDE.md's deploy section for the full runbook. `app` must be globally
# unique across all of Fly — rename it before your first `fly launch`.
app = "fpl-bot"
primary_region = "lhr"

[build]

[env]
  # Non-secret defaults only — everything else (FPL_TEAM_ID,
  # FPL_REFRESH_TOKEN, AUTH_PUSH_SECRET, TELEGRAM_BOT_TOKEN,
  # TELEGRAM_CHAT_ID, DATABASE_URL) is set via `fly secrets set`, never
  # committed here.
  DEADLINE_LEAD_HOURS = "24"
  OPTIMIZER_MAX_HITS_PER_WEEK = "1"
  OPTIMIZER_HIT_RISK_PREMIUM = "4"
  # Points FplAuthClient at the mounted volume below instead of rewriting
  # .env, which wouldn't survive a restart on Fly's ephemeral filesystem —
  # see CLAUDE.md's "Execution auth" deploy note.
  TOKEN_STORE_PATH = "/data/fpl-refresh-token.txt"

[[mounts]]
  source = "fpl_bot_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
