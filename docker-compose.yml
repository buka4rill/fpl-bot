services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-fpl_bot}
      POSTGRES_USER: ${DATABASE_USER:-fpl_bot}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-fpl_bot}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - fpl-bot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-fpl_bot}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fpl-bot-postgres-data:
