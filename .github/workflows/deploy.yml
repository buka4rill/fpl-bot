name: Deploy

# Runs only after the CI workflow finishes on main, gated on CI actually
# passing (workflow_run, not push — a plain `push:` trigger here would run
# in parallel with ci.yml with no ordering guarantee, so a broken commit
# could deploy before its own CI failure was even reported). Plus manual
# re-runs from the Actions tab. Safe as an auto-trigger because main is
# branch-protected: only a direct push from an admin (buka4rill) or a merge
# of an approved, admin-reviewed PR can ever land on main in the first
# place — this workflow deploys exactly the commit CI validated
# (github.event.workflow_run.head_sha), not just "whatever's on main now".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
