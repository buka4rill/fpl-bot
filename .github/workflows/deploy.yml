name: Deploy

# Deploys on every push to main, plus manual re-runs from the Actions tab.
# Safe as an auto-trigger because main is branch-protected: only a direct
# push from an admin (buka4rill) or a merge of an approved, admin-reviewed
# PR can ever land on main in the first place — a push landing here is
# already the deliberate "make this live" action, not a side effect of
# someone else's PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
